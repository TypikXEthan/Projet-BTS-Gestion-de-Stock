<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>

    <!-- Lien vers le CSS Flask -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ihm.css') }}">
</head>
<body>

    <div class="carte-connexion">
        <div class="logo"></div>

        <h2>Connexion</h2>

            <input type="password" name="mot_de_passe" placeholder="Mot de passe" required>

            <button type="submit">Se connecter</button>
        </form>

        <div class="footer">
            Projet RFID – BTS CIEL
        </div>
    </div>

</body>
</html>


<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Matériel - Live RFID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ecran.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        .modal-overlay { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); }
        .glass-modal { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 2rem; }
        #edit-list-container::-webkit-scrollbar { width: 5px; }
        #edit-list-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="overflow-hidden bg-black text-white">

    <header class="header-flux flex justify-between items-center p-6 bg-black/20 border-b border-white/10">
        <h1 class="text-2xl font-black uppercase tracking-tighter">RFID</h1>
    </header>

    <main class="flux-container flex gap-6 p-6 h-[72vh]">
        <div class="glass-column flex-1 flex flex-col bg-white/5 rounded-3xl border border-white/10 overflow-hidden">
            <div class="p-4 font-black text-xl flex justify-between border-b border-white/10 text-green-400">
                <span>EN STOCK</span>
                <span id="count-entree" class="bg-white/10 px-3 py-1 rounded-full text-sm text-white">0</span>
            </div>
            <div id="liste-entree" class="scroll-area flex-1 overflow-y-auto p-4"></div>
        </div>

        <div class="glass-column flex-1 flex flex-col bg-white/5 rounded-3xl border border-white/10 overflow-hidden">
            <div class="p-4 font-black text-xl flex justify-between border-b border-white/10 text-red-400">
                <span>SORTIE</span>
                <span id="count-sortie" class="bg-white/10 px-3 py-1 rounded-full text-sm text-white">0</span>
            </div>
            <div id="liste-sortie" class="scroll-area flex-1 overflow-y-auto p-4"></div>
        </div>
    </main>

    <footer class="actions-bar fixed bottom-0 w-full p-6 flex justify-center gap-4 bg-black/30 backdrop-blur-md">
        <a href="http://172.29.241.141:5000/" class="bg-blue-600 text-white px-8 py-4 rounded-xl font-bold uppercase text-xs hover:bg-blue-500 transition-all shadow-lg flex items-center">IHM CONFIG</a>
        
        <button onclick="openModal('modal-rectif')" class="bg-white/10 text-white px-8 py-4 rounded-xl font-bold uppercase text-xs border border-white/10 hover:bg-white/20">RECTIFICATIONS</button>
        
        <button onclick="openModal('modal-terminer')" class="bg-red-600 text-white px-8 py-4 rounded-xl font-bold uppercase text-xs shadow-lg hover:bg-red-500">TERMINER LA SESSION</button>
    </footer>

    <div id="modal-rectif" class="fixed inset-0 modal-overlay flex items-center justify-center hidden z-50 p-4">
        <div class="glass-modal w-full max-w-2xl p-8 relative flex flex-col max-h-[85vh]">
            <button onclick="closeModal('modal-rectif')" class="absolute top-6 right-6 text-2xl opacity-50 hover:opacity-100">✕</button>
            <h2 class="text-3xl font-black mb-6 uppercase">Modifier la liste</h2>
            <div id="edit-list-container" class="flex-1 overflow-y-auto space-y-3 pr-2 mb-6 text-white"></div>
            <button onclick="closeModal('modal-rectif')" class="w-full p-4 bg-white text-blue-900 font-bold rounded-xl uppercase">Appliquer</button>
        </div>
    </div>

    <div id="modal-terminer" class="fixed inset-0 modal-overlay flex items-center justify-center hidden z-50 p-4">
        <div class="glass-modal w-full max-w-md p-8 relative">
            <button onclick="closeModal('modal-terminer')" class="absolute top-6 right-6 text-2xl opacity-50 hover:opacity-100">✕</button>
            <h2 class="text-2xl font-black mb-6 uppercase text-center">Clôturer la Session</h2>
            <div class="space-y-4 mb-8 text-left">
                <div>
                    <label class="text-[10px] font-bold opacity-50 uppercase ml-1">Utilisateur</label>
                    <input type="text" id="final-user" class="w-full bg-white/10 border border-white/20 p-4 rounded-xl text-white outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="text-[10px] font-bold opacity-50 uppercase ml-1">Mot de passe</label>
                    <input type="password" id="final-password" class="w-full bg-white/10 border border-white/20 p-4 rounded-xl text-white outline-none focus:border-red-500">
                </div>
            </div>
            <button onclick="validerEtTerminer()" class="w-full p-4 bg-red-600 rounded-xl font-bold uppercase shadow-lg hover:bg-red-500 transition-all">Enregistrer en BDD</button>
        </div>
    </div>

    <script>
        const socket = io();

        socket.on('mouvement_stock', (data) => {
            const old = document.getElementById(`item-${data.id}`);
            if (old) old.remove();

            const card = document.createElement('div');
            card.id = `item-${data.id}`;
            const isDispo = (data.etat === 'Disponible');
            
            card.className = `mb-4 p-4 rounded-2xl flex justify-between items-center border-l-8 ${isDispo ? 'bg-green-500/10 border-green-500' : 'bg-red-500/10 border-red-500'}`;
            card.innerHTML = `
                <div>
                    <h3 class="font-bold text-lg text-white">${data.nom}</h3>
                    <p class="text-[10px] text-white/40 font-mono uppercase italic">${data.id}</p>
                </div>
                <div class="text-2xl">${isDispo ? '✅' : '📦'}</div>
            `;

            document.getElementById(isDispo ? 'liste-entree' : 'liste-sortie').prepend(card);
            updateCounts();
        });

        function updateCounts() {
            document.getElementById('count-entree').innerText = document.getElementById('liste-entree').children.length;
            document.getElementById('count-sortie').innerText = document.getElementById('liste-sortie').children.length;
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            if (id === 'modal-rectif') genererRectif();
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function genererRectif() {
            const container = document.getElementById('edit-list-container');
            container.innerHTML = '';
            const items = document.querySelectorAll('[id^="item-"]');
            
            if(items.length === 0) {
                container.innerHTML = '<p class="text-center opacity-30 py-10 italic">Aucun scan détecté</p>';
                return;
            }

            items.forEach(item => {
                const id = item.id.replace('item-', '');
                const nom = item.querySelector('h3').innerText;
                const isDispo = item.classList.contains('border-green-500');

                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-white/5 p-4 rounded-xl border border-white/10";
                row.innerHTML = `
                    <div><p class="font-bold text-sm">${nom}</p><p class="text-[9px] opacity-40 font-mono">${id}</p></div>
                    <div class="flex gap-2">
                        <button onclick="toggleEtat('${id}')" class="px-4 py-2 rounded-lg text-[10px] font-black ${isDispo ? 'bg-green-600' : 'bg-red-600'}">BASCULER ⇆</button>
                        <button onclick="retirer('${id}')" class="p-2 bg-white/10 rounded-lg hover:bg-red-900 transition-all text-lg">🗑️</button>
                    </div>`;
                container.appendChild(row);
            });
        }

        function toggleEtat(tag) {
            fetch('/scan_objet', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ rfid_tag_epc: tag }) })
            .then(() => setTimeout(genererRectif, 150));
        }

        function retirer(tag) {
            fetch('/supprimer_de_session', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ rfid_tag_epc: tag }) })
            .then(() => {
                const el = document.getElementById(`item-${tag}`);
                if (el) el.remove();
                updateCounts();
                genererRectif();
            });
        }

        function validerEtTerminer() {
            const user = document.getElementById('final-user').value;
            const pass = document.getElementById('final-password').value;
            
            fetch('/valider_session_finale', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user: user, password: pass })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'ok') {
                    alert("✅ Session enregistrée avec succès !");
                    window.location.href = "/tablette";
                } else {
                    alert("❌ Erreur : " + data.message);
                }
            });
        }
    </script>
</body>
</html>

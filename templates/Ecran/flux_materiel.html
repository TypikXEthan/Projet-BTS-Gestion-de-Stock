<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Matériel - Live RFID</title>
    <script src="https://cdn.tailwindcss.com"></script>
   <link rel="stylesheet" href="{{ url_for('static', filename='css/ecran.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>

    <header class="header-flux flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black">Projet RFID</h1>
            <div class="flex items-center gap-2">
            </div>
        </div>
        <div class="text-right">
            <span class="text-xs opacity-50 block uppercase">Session</span>
            <span class="font-mono text-sm">PROJET-BTS-2026</span>
        </div>
    </header>

    <main class="flux-container">
        
        <div class="glass-column">
            <div class="column-header" style="color: var(--vert);">
                <span> EN STOCK / ENTRÉE</span>
                <span id="count-entree" class="bg-white/10 px-3 py-1 rounded-full text-sm text-white">0</span>
            </div>
            <div id="liste-entree" class="scroll-area">
                </div>
        </div>

        <div class="glass-column">
            <div class="column-header" style="color: var(--rouge);">
                <span> SORTIE / EMPRUNT</span>
                <span id="count-sortie" class="bg-white/10 px-3 py-1 rounded-full text-sm text-white">0</span>
            </div>
            <div id="liste-sortie" class="scroll-area">
                </div>
        </div>

    </main>

    <footer class="actions-bar">
        <a href="http://172.29.241.141:5000/" class="btn-action btn-blue">Configuration IHM</a>
        <a href="/admin/rectification" class="btn-action btn-white">Rectifications</a>
        <a href="/tablette" class="btn-action btn-red">Terminer la session</a>
    </footer>

    <script>
        const socket = io();

        socket.on('mouvement_stock', (data) => {
            console.log("Scan détecté :", data);

            // 1. On retire l'ancienne carte si elle existe
            const old = document.getElementById(`item-${data.id}`);
            if (old) old.remove();

            // 2. On crée la nouvelle ligne
            const card = document.createElement('div');
            card.id = `item-${data.id}`;
            const isDispo = (data.etat === 'Disponible');
            card.className = `item-card new-scan ${isDispo ? 'is-dispo' : 'is-sortie'}`;
            
            card.innerHTML = `
                <div>
                    <h3 class="font-bold text-lg">${data.nom}</h3>
                    <p class="text-[10px] opacity-40 font-mono">TAG: ${data.id}</p>
                </div>
                <div class="text-right">
                    <span class="text-2xl">${isDispo ? '✅' : '📦'}</span>
                    <p class="text-[9px] font-black uppercase ${isDispo ? 'text-green-400' : 'text-red-400'}">
                        ${isDispo ? 'Entré' : 'Sorti'}
                    </p>
                </div>
            `;

            // 3. On range dans la bonne colonne
            const container = document.getElementById(isDispo ? 'liste-entree' : 'liste-sortie');
            container.prepend(card);

            // 4. Update compteurs
            document.getElementById('count-entree').innerText = document.getElementById('liste-entree').children.length;
            document.getElementById('count-sortie').innerText = document.getElementById('liste-sortie').children.length;

            // Clean animation
            setTimeout(() => card.classList.remove('new-scan'), 800);
        });
    </script>
</body>
</html>
